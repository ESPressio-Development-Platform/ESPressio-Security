name: Repository Migration Normalizer

on:
  push:
    branches:
      - maintenance/13-repository-migration

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/13-repository-migration
      - name: Normalize Security repository identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/migration-normalize.yml')
          replacements = [
              ('https://github.com/Flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('https://github.com/flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('Flowduino/ESPressio-', 'ESPressio-Development-Platform/ESPressio-'),
              ('flowduino/ESPressio-', 'espressio-development-platform/ESPressio-'),
              ('https://flowduino.com', 'https://espressio.org'),
              ('http://flowduino.com', 'https://espressio.org'),
              ('Flowduino ESPressio Development Platform', 'ESPressio Development Platform'),
              ('Flowduino ESPressio-', 'ESPressio-'),
              ('"name": "Flowduino"', '"name": "Simon J. Stuart"'),
              ('"name":"Flowduino"', '"name":"Simon J. Stuart"'),
              ('author=Flowduino', 'author=Simon J. Stuart'),
              ('maintainer=Flowduino', 'maintainer=Simon J. Stuart'),
              ('url=https://github.com/ESPressio-Development-Platform/ESPressio-Security', 'url=https://espressio.org'),
              ('ESP-Now       0.7.0', 'ESP-Now       0.8.0'),
              ('ESP-Now 0.7.0', 'ESP-Now 0.8.0'),
              ('ESP-Now >= 0.7.0', 'ESP-Now >= 0.8.0'),
              ('Serial        0.7.1', 'Serial        0.7.2'),
              ('Serial 0.7.1', 'Serial 0.7.2'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)
          PY
      - name: Report residual legacy references
        shell: bash
        run: |
          grep -R -n -i 'flowduino' . --exclude-dir=.git --exclude=migration-normalize.yml || true
      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          rm .github/workflows/migration-normalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Security repository identity (#13)'
          git push
