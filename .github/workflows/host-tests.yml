name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core Security remains Event/Mesh-free
        run: |
          if grep -R -nE '#[[:space:]]*include[[:space:]]*[<\"]ESPressio_(Event|Mesh|SecurityEvents|TransportSecurityEventBridge)' src/ESPressio_Security.hpp; then
            echo 'Core Security umbrella must not acquire Event or Mesh integration.'
            exit 1
          fi
      - name: Configure
        run: cmake -S tests -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-event-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: structural_realignment
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: structural_realignment
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: structural_realignment
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: structural_realignment
          path: project/dependencies/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: structural_realignment
          path: project/dependencies/ESPressio-Event
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create Event integration compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -fno-rtti
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../ESPressio-Security
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Security.hpp>
          #include <ESPressio_SecurityEvents.hpp>
          #include <ESPressio_TransportSecurityEventBridge.hpp>
          void setup() {}
          void loop() {}
          EOF
      - name: Compile Security Event integration against coordinated RTTI-free stack
        run: pio run -d project/compile

  esp32-mesh-v1-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: project/dependencies/ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: project/dependencies/ESPressio-Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Mesh
          ref: structural_realignment_propagation
          path: project/dependencies/ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: structural_realignment
          path: project/dependencies/ESPressio-Observable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create bounded Mesh v1 provider compile project
        shell: bash
        run: |
          mkdir -p project/mesh-provider/src
          cat > project/mesh-provider/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17
          build_unflags = -std=gnu++11
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Primitive
              ../dependencies/ESPressio-Radio
              ../dependencies/ESPressio-Mesh
              ../dependencies/ESPressio-Observable
              ../ESPressio-Security
          EOF
          cat > project/mesh-provider/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_MeshV1MbedTLSProvider.hpp>

          static_assert(ESPRESSIO_SECURITY_HAS_MESH_V1_MBEDTLS == 1);

          class Random final : public ESPressio::Security::IRandomSource {
          public:
              bool Fill(uint8_t* output, std::size_t size) override {
                  if (output == nullptr && size != 0U) return false;
                  for (std::size_t index = 0; index < size; ++index) output[index] = static_cast<uint8_t>(index + 1U);
                  return true;
              }
          } randomSource;

          class Signer final : public ESPressio::Security::IMeshV1IdentitySigner {
          public:
              ESPressio::System::DeviceIdentifier Device() const noexcept override { return {}; }
              bool SignP256Sha256Digest(const ESPressio::Mesh::MeshSecurityDigest&, ESPressio::Mesh::MeshIdentitySignature&) noexcept override { return false; }
          } signer;

          class Identities final : public ESPressio::Security::IMeshV1RegisteredIdentitySource {
          public:
              bool LookupP256PublicKey(const ESPressio::System::DeviceIdentifier&, ESPressio::Mesh::MeshIdentityPublicKey&) const noexcept override { return false; }
          } identities;

          ESPressio::Security::MeshV1MbedTLSProvider<4, 32> provider(randomSource, signer, identities);
          void setup() { provider.ResetForControlledShutdown(); }
          void loop() {}
          EOF
      - name: Compile fixed-capacity Mesh v1 provider against mbedTLS
        run: pio run -d project/mesh-provider

  host-mesh-v1-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Mesh
          ref: structural_realignment_propagation
          path: ESPressio-Mesh
      - name: Install host mbedTLS development package
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Build concrete Mesh v1 interoperability regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Security/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Mesh/src
          ESPressio-Security/tests/mesh_v1_mbedtls_provider_test.cpp
          -lmbedcrypto -o mesh_v1_mbedtls_provider_test
      - name: Run concrete Mesh v1 interoperability regression
        run: ./mesh_v1_mbedtls_provider_test
