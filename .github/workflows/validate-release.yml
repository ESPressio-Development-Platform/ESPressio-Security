name: Validate Security Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-release.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and report
        shell: bash
        run: |
          set +e
          cmake -S tests -B build > host-config.log 2>&1
          hc=$?
          if [ $hc -eq 0 ]; then cmake --build build --parallel > host-build.log 2>&1; hb=$?; else hb=99; : > host-build.log; fi
          if [ $hb -eq 0 ]; then ctest --test-dir build --output-on-failure > host-test.log 2>&1; ht=$?; else ht=99; : > host-test.log; fi
          pip install platformio > pio-install.log 2>&1
          pi=$?
          if [ $pi -eq 0 ]; then
            pio ci examples/BasicSecurePayload/BasicSecurePayload.ino --board esp32dev --lib . --project-option="build_flags=-std=gnu++17" --project-option="build_unflags=-std=gnu++11" > basic.log 2>&1
            pb=$?
            pio ci examples/MbedTLSAlgorithms/MbedTLSAlgorithms.ino --board esp32dev --lib . --project-option="build_flags=-std=gnu++17" --project-option="build_unflags=-std=gnu++11" > algorithms.log 2>&1
            pa=$?
          else
            pb=99; pa=99; : > basic.log; : > algorithms.log
          fi
          mkdir -p .ci
          {
            echo "host_config_exit=$hc"
            echo "host_build_exit=$hb"
            echo "host_test_exit=$ht"
            echo "platformio_install_exit=$pi"
            echo "basic_example_exit=$pb"
            echo "algorithms_example_exit=$pa"
            echo "--- HOST BUILD ---"; cat host-build.log
            echo "--- HOST TEST ---"; cat host-test.log
            echo "--- BASIC EXAMPLE ---"; cat basic.log
            echo "--- ALGORITHMS EXAMPLE ---"; cat algorithms.log
          } > .ci/security-0.1.0-validation.txt
          cat .ci/security-0.1.0-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .ci/security-0.1.0-validation.txt
          git commit -m "chore: record Security 0.1.0 validation" || true
          git push origin HEAD:main

# final validation after all 0.1.0 fixes
